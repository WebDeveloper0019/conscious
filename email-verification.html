<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FF9933" />
  <title>Email Verification — Conscious Indi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/bharatcraft.css" />
  <style>
    .bc-auth-section {
      min-height: 80vh;
      display: flex;
      align-items: center;
      padding: 60px 0;
      background: var(--bg-cream);
    }
    .bc-auth-card {
      background: #fff;
      padding: 40px;
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-md);
      text-align: center;
      max-width: 500px;
      margin: 0 auto;
    }
    .bc-auth-icon {
      width: 80px;
      height: 80px;
      background: var(--saffron-pale);
      color: var(--saffron);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 24px;
    }
  </style>
</head>
<body>

<!-- PRELOADER -->
<div id="bc-preloader" role="status" aria-label="Loading Conscious Indi">
  <img src="assets/images/symbol.png" alt="Conscious Indi" class="bc-preloader-symbol" width="90" height="90" aria-hidden="true" />
  <div class="bc-preloader-brand">Conscious Indi</div>
  <div class="bc-preloader-chakra"></div>
</div>

<main class="bc-auth-section">
  <div class="container">
    <div class="bc-auth-card">
      <div class="bc-auth-icon">
        <i class="fa-solid fa-envelope-circle-check"></i>
      </div>
      <h1 class="bc-section-title">Verify Your Email</h1>
      <p class="bc-section-desc mb-4">
        We've sent a verification link to <strong>user@example.com</strong>. Please check your inbox and click the link to activate your account.
      </p>
      
      <div class="d-grid gap-3">
        <a href="login.html" class="bc-btn bc-btn-primary">Go to Login</a>
        <button class="bc-btn bc-btn-outline" id="resend-btn">Resend Verification Link</button>
      </div>

      <p class="mt-4 mb-0 text-muted" style="font-size: 0.875rem;">
        Didn't receive the email? Check your spam folder or contact <a href="contact.html" class="text-decoration-underline">support</a>.
      </p>
    </div>
  </div>
</main>

<script src="assets/js/bharatcraft.js"></script>
<script>
  document.getElementById('resend-btn').addEventListener('click', function() {
    this.innerText = 'Sending...';
    this.disabled = true;
    setTimeout(() => {
      this.innerText = 'Link Resent!';
      this.classList.replace('bc-btn-outline', 'bc-btn-primary');
    }, 1500);
  });
</script>
</body>
</html>
