<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FF9933" />
  <title>OTP Verification — Conscious Indi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/bharatcraft.css" />
  <style>
    .bc-auth-section {
      min-height: 80vh;
      display: flex;
      align-items: center;
      padding: 60px 0;
      background: var(--bg-cream);
    }
    .bc-auth-card {
      background: #fff;
      padding: 40px;
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-md);
      text-align: center;
      max-width: 450px;
      margin: 0 auto;
    }
    .otp-input-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 30px 0;
    }
    .otp-input {
      width: 50px;
      height: 60px;
      border: 2px solid var(--border-warm);
      border-radius: var(--r-sm);
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--navy);
      transition: all var(--t-fast);
    }
    .otp-input:focus {
      border-color: var(--saffron);
      box-shadow: 0 0 0 4px var(--saffron-pale);
    }
  </style>
</head>
<body>

<!-- PRELOADER -->
<div id="bc-preloader" role="status" aria-label="Loading Conscious Indi">
  <img src="assets/images/symbol.png" alt="Conscious Indi" class="bc-preloader-symbol" width="90" height="90" aria-hidden="true" />
  <div class="bc-preloader-brand">Conscious Indi</div>
  <div class="bc-preloader-chakra"></div>
</div>

<main class="bc-auth-section">
  <div class="container">
    <div class="bc-auth-card">
      <h1 class="bc-section-title">Verify OTP</h1>
      <p class="bc-section-desc mb-0">Enter the 6-digit code sent to</p>
      <p class="fw-bold text-navy" id="verifyEmail">your email</p>
      
      <div class="otp-input-group">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-input" autofocus>
        <input type="text" maxlength="1" inputmode="numeric" class="otp-input">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-input">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-input">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-input">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-input">
      </div>     
      <div id="otpAlert" class="alert alert-danger d-none"></div>
      <div class="d-grid mb-4">
        <button id="verifyBtn" class="bc-btn bc-btn-primary">Verify & Proceed</button>
      </div>

      <div class="text-muted" style="font-size: 0.875rem;">
        Resend code in <span id="timer" class="fw-bold">00:59</span>
      </div>
      <button class="btn btn-link text-saffron p-0 mt-2 d-none" id="resend-otp" style="font-size: 0.875rem; font-weight: 600;">Resend OTP</button>
    </div>
  </div>
</main>

<script src="assets/js/bharatcraft.js"></script>
<script>
  const email = sessionStorage.getItem('ci_verify_email') || '';
  document.getElementById('verifyEmail').textContent = email || 'your email';
  const alertBox = document.getElementById('otpAlert');
  const showOtpError = (msg) => { alertBox.textContent = msg; alertBox.classList.remove('d-none'); };
  // OTP Input Auto-focus
  const inputs = document.querySelectorAll('.otp-input');
  inputs.forEach((input, index) => {
    input.addEventListener('keyup', (e) => {
      if (/\D/.test(e.target.value)) e.target.value = '';
      if (e.target.value.length === 1 && index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
      if (e.key === 'Backspace' && index > 0) {
        inputs[index - 1].focus();
      }
    });
  });

  document.getElementById('verifyBtn').addEventListener('click', async () => {
    alertBox.classList.add('d-none');
    const otp = Array.from(inputs).map(i => i.value).join('');
    if (!email) return showOtpError('Verification email is missing. Please register again.');
    if (otp.length !== 6) return showOtpError('Please enter the complete 6-digit OTP.');
    const btn = document.getElementById('verifyBtn'); btn.disabled = true; btn.textContent = 'Verifying…';
    try {
      const res = await fetch('api/auth/verify-otp.php', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,otp})});
      const data = await res.json();
      if (res.ok && data.success) {
        localStorage.setItem('ci_token', data.token); localStorage.setItem('ci_user', JSON.stringify(data.user));
        sessionStorage.removeItem('ci_verify_email'); window.location.href='customer/dashboard'; return;
      }
      showOtpError(data.message || 'OTP verification failed.');
    } catch(e) { showOtpError('Could not connect to the server.'); }
    btn.disabled = false; btn.textContent = 'Verify & Proceed';
  });

  // Timer logic
  let timeLeft = 59;
  const timerDisplay = document.getElementById('timer');
  const resendBtn = document.getElementById('resend-otp');
  
  resendBtn.addEventListener('click', async () => {
    resendBtn.disabled = true;
    try {
      const res = await fetch('api/auth/resend-otp.php', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email})});
      const data = await res.json();
      if (!res.ok) showOtpError(data.message || 'Could not resend OTP.');
      else { showOtpError('OTP sent again. Check your email.'); alertBox.className='alert alert-success'; }
    } catch(e) { showOtpError('Could not connect to the server.'); }
    resendBtn.disabled = false;
  });

  const countdown = setInterval(() => {
    if (timeLeft <= 0) {
      clearInterval(countdown);
      timerDisplay.parentElement.classList.add('d-none');
      resendBtn.classList.remove('d-none');
    } else {
      timerDisplay.innerText = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
      timeLeft--;
    }
  }, 1000);
</script>
</body>
</html>
