<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Onboarding — Conscious Indi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/bharatcraft.css" />
  <style>
    .step-indicator {
      display: flex;
      justify-content: space-between;
      margin-bottom: 50px;
      position: relative;
    }
    .step-indicator::before {
      content: '';
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--border-warm);
      z-index: 1;
    }
    .step {
      width: 40px;
      height: 40px;
      background: #fff;
      border: 2px solid var(--border-warm);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      z-index: 2;
      position: relative;
    }
    .step.active {
      border-color: var(--saffron);
      background: var(--saffron);
      color: #fff;
    }
    .step.completed {
      border-color: var(--green);
      background: var(--green);
      color: #fff;
    }
    .step-label {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .step.active + .step-label { color: var(--text-primary); }
  </style>
</head>
<body class="bg-cream">

<main class="section-py">
  <div class="container">
    <div class="max-width-800 mx-auto">
      <div class="text-center mb-5">
        <img src="../assets/images/logo-horizontal.png" width="200" class="mb-4" alt="Logo">
        <h1 class="bc-section-title">Vendor Onboarding</h1>
        <p class="bc-section-desc mx-auto">Complete these 4 simple steps to start selling your handcrafted treasures.</p>
      </div>

      <div class="step-indicator">
        <div class="step active">1 <span class="step-label">Store Info</span></div>
        <div class="step">2 <span class="step-label">Verification</span></div>
        <div class="step">3 <span class="step-label">Payments</span></div>
        <div class="step">4 <span class="step-label">Finish</span></div>
      </div>

      <div class="bg-white p-5 rounded shadow-sm border">
        <form id="onboarding-form">
          <div class="step-content" id="step-1">
            <h4 class="fw-bold mb-4">Tell us about your store</h4>
            <div class="mb-4">
              <label class="form-label fw-bold">Store Name</label>
              <input type="text" class="form-control p-3" placeholder="e.g. Jaipur Artisans Collective">
            </div>
            <div class="mb-4">
              <label class="form-label fw-bold">Store Description</label>
              <textarea class="form-control p-3" rows="4" placeholder="Describe your craft and heritage..."></textarea>
            </div>
            <div class="mb-4">
              <label class="form-label fw-bold">Primary Category</label>
              <select class="form-select p-3">
                <option>Pottery & Ceramics</option>
                <option>Handloom & Textiles</option>
                <option>Jewelry</option>
                <option>Paintings</option>
              </select>
            </div>
          </div>

          <div class="d-flex justify-content-between mt-5">
            <button type="button" class="bc-btn bc-btn-outline" disabled>Previous</button>
            <button type="button" class="bc-btn bc-btn-primary" onclick="window.location.href='dashboard'">Save & Continue</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>

<script src="../assets/js/bharatcraft.js"></script>
<script src="../assets/js/panel-auth.js"></script>
</body>
</html>
