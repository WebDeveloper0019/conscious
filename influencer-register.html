<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FF9933" />
  <title>Influencer Registration — Conscious Indi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/bharatcraft.css" />
  <style>
    .influencer-register-shell { padding: 56px 0 72px; background: linear-gradient(180deg, #fffdf8 0%, #f7f1e8 100%); }
    .influencer-register-card { background: #fff; border-radius: 24px; box-shadow: 0 20px 60px rgba(10,0,64,0.12); border: 1px solid rgba(66,37,5,0.08); overflow: hidden; }
    .influencer-register-header { padding: 28px 32px; background: linear-gradient(135deg, var(--navy), #31106d); color: white; }
    .influencer-register-body { padding: 28px 32px 32px; }
    .influencer-register-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .influencer-register-field { display: flex; flex-direction: column; gap: 8px; }
    .influencer-register-field.full { grid-column: 1 / -1; }
    .influencer-register-field label { font-size: 0.92rem; font-weight: 700; color: var(--text-primary); }
    .influencer-register-field input, .influencer-register-field select, .influencer-register-field textarea { border: 1px solid rgba(10,0,64,0.14); border-radius: 14px; padding: 12px 14px; background: #fff; }
    .influencer-register-field textarea { min-height: 110px; resize: vertical; }
    .influencer-register-submit { width: 100%; justify-content: center; font-size: 1rem; padding: 14px 20px; }
    .influencer-register-note { text-align: center; margin-top: 20px; color: var(--text-muted); font-size: 0.95rem; }
    @media (max-width: 768px) { .influencer-register-form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div id="bc-preloader" role="status" aria-label="Loading Conscious Indi">
  <img src="assets/images/symbol.png" alt="Conscious Indi" class="bc-preloader-symbol" width="90" height="90" aria-hidden="true" />
  <div class="bc-preloader-brand">Conscious Indi</div>
  <div class="bc-preloader-chakra"></div>
</div>
<main class="influencer-register-shell">
  <div class="container">
    <div class="influencer-register-card">
      <div class="influencer-register-header">
        <div class="bc-section-label" style="color:var(--saffron-light);">Creator community</div>
        <h1 style="font-family:var(--font-display);font-size:2rem;margin:0;">Register as an Influencer</h1>
        <p style="margin:12px 0 0;color:rgba(255,255,255,0.82);max-width:760px;">Your registration goes to Admin for review. Profiles stay hidden until approval so only approved creators appear publicly.</p>
      </div>
      <div class="influencer-register-body">
        <form id="influencer-registration-form" class="needs-validation" novalidate>
          <div class="influencer-register-form-grid">
            <div class="influencer-register-field">
              <label for="influencer-profile-image">Profile Image</label>
              <input id="influencer-profile-image" name="profileImage" type="file" accept="image/*" />
            </div>
            <div class="influencer-register-field">
              <label for="influencer-full-name">Full Name <span aria-hidden="true">*</span></label>
              <input id="influencer-full-name" name="fullName" type="text" required />
            </div>
            <div class="influencer-register-field">
              <label for="influencer-email">Email Address <span aria-hidden="true">*</span></label>
              <input id="influencer-email" name="email" type="email" required />
            </div>
            <div class="influencer-register-field">
              <label for="influencer-password">Password <span aria-hidden="true">*</span></label>
              <input id="influencer-password" name="password" type="password" required />
            </div>
            <div class="influencer-register-field">
              <label for="influencer-contact-number">Contact Number <span aria-hidden="true">*</span></label>
              <input id="influencer-contact-number" name="contactNumber" type="tel" required />
            </div>
            <div class="influencer-register-field">
              <label for="influencer-whatsapp">WhatsApp Number</label>
              <input id="influencer-whatsapp" name="whatsappNumber" type="tel" />
            </div>
            <div class="influencer-register-field">
              <label for="influencer-city">City</label>
              <input id="influencer-city" name="city" type="text" />
            </div>
            <div class="influencer-register-field">
              <label for="influencer-brand-name">Creator / Brand Name</label>
              <input id="influencer-brand-name" name="brandName" type="text" />
            </div>
            <div class="influencer-register-field full">
              <label for="influencer-about">About Yourself</label>
              <textarea id="influencer-about" name="about" placeholder="Share your creative story, audience, and niche."></textarea>
            </div>
            <div class="influencer-register-field">
              <label for="influencer-category">Category / Niche</label>
              <select id="influencer-category" name="category">
                <option value="" selected>Select category</option>
                <option>Fashion & Lifestyle</option>
                <option>Home Decor</option>
                <option>Art & Craft</option>
                <option>Beauty & Wellness</option>
                <option>Travel & Culture</option>
                <option>Food & Sustainability</option>
                <option>Parenting & Community</option>
              </select>
            </div>
            <div class="influencer-register-field">
              <label for="influencer-social-links">Social Media Links</label>
              <input id="influencer-social-links" name="socialLinks" type="text" placeholder="Instagram, YouTube, LinkedIn, etc." />
            </div>
            <div class="influencer-register-field">
              <label for="influencer-portfolio-upload">Portfolio Upload</label>
              <input id="influencer-portfolio-upload" name="portfolioUpload" type="file" accept=".pdf,.doc,.docx,image/*" />
            </div>
            <div class="influencer-register-field">
              <label for="influencer-portfolio-url">Portfolio URL</label>
              <input id="influencer-portfolio-url" name="portfolioUrl" type="url" placeholder="https://your-portfolio.com" />
            </div>
            <div class="influencer-register-field">
              <label for="influencer-availability">Availability</label>
              <select id="influencer-availability" name="availability">
                <option value="" selected>Select availability</option>
                <option>Full Time</option>
                <option>Part Time</option>
                <option>Freelance</option>
              </select>
            </div>
            <div class="influencer-register-field full">
              <label for="influencer-government-id">Government ID / Verification Document Upload</label>
              <input id="influencer-government-id" name="governmentDocument" type="file" accept=".pdf,.jpg,.jpeg,.png" />
            </div>
            <div class="influencer-register-field full">
              <label class="d-flex align-items-center gap-2"><input type="checkbox" name="terms" required /> <span>I agree to the Terms &amp; Conditions</span></label>
            </div>
          </div>
          <div class="mt-4">
            <button class="bc-btn bc-btn-primary influencer-register-submit" type="submit"><i class="fa-solid fa-user-plus"></i> Register</button>
          </div>
        </form>
        <div class="influencer-register-note">Already have an account? <a href="influencer-login.html" style="color:var(--saffron-dark);font-weight:700;">Sign In</a></div>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/bharatcraft.js"></script>
<script src="assets/js/influencer-admin-demo.js"></script>
</body>
</html>
